<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<title>Ridgeline — Jobs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:100; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }
.btn-new  { background: #3d8b3d; color: #fff; border: none; border-radius: 8px;
            padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; }

.search-bar { padding: 14px 16px; max-width: 680px; margin: 0 auto; }
.search-bar input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
                    padding: 11px 14px; color: #f0f0f0; font-size: 15px; outline: none; }
.search-bar input:focus { border-color: #3d8b3d; }

.list { max-width: 680px; margin: 0 auto; padding: 0 16px 60px; }
.quote-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px;
              padding: 16px; margin-bottom: 10px; }
.q-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.q-num  { font-size: 11px; font-weight: 700; color: #3d8b3d; }
.q-name { font-size: 16px; font-weight: 700; flex: 1; }
.q-status { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; }
.s-pending  { background: #2e2000; color: #ffab40; }
.s-accepted { background: #1f2e1f; color: #5dbf5d; }
.s-done     { background: #1a1a2e; color: #7c9fff; }

.q-meta { font-size: 12px; color: #666; margin-bottom: 4px; }
.q-addr { font-size: 12px; color: #888; margin-bottom: 8px; }
.q-total { font-size: 16px; font-weight: 900; color: #3d8b3d; }
.q-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn-sms-small { flex:1; padding: 9px; background: #1f2e1f; border: 1px solid #3d8b3d;
                 color: #5dbf5d; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-status { padding: 9px 14px; background: #222; border: 1px solid #333; color: #aaa;
              border-radius: 8px; font-size: 12px; cursor: pointer; }
.btn-status:hover { border-color: #3d8b3d; color: #f0f0f0; }

.empty { text-align: center; padding: 60px 20px; color: #666; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
         background: #3d8b3d; color: #fff; padding: 10px 20px; border-radius: 8px;
         font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s;
         pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">Jobs</div>
  <a href="/quote" class="btn-new">+ New</a>
  <a href="/home" class="btn-back" style="margin-left:8px">← Home</a>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search by name, address, quote #…" oninput="filterQuotes()">
</div>

<div class="list" id="quoteList">
  <div class="empty">Loading…</div>
</div>

<div class="toast" id="toast"></div>

<script>
let allQuotes = [];

async function load() {
  const res = await fetch('/api/quotes');
  allQuotes = await res.json();
  render(allQuotes);
}

function filterQuotes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(allQuotes.filter(x =>
    (x.customer_name||'').toLowerCase().includes(q) ||
    (x.address||'').toLowerCase().includes(q) ||
    (x.quote_number||'').toLowerCase().includes(q)
  ));
}

function render(list) {
  if (!list.length) {
    document.getElementById('quoteList').innerHTML = '<div class="empty">No quotes yet. <a href="/quote" style="color:#3d8b3d">Create one →</a></div>';
    return;
  }
  document.getElementById('quoteList').innerHTML = list.map(q => {
    const date = q.created_at ? new Date(q.created_at).toLocaleDateString('en-AU') : '';
    const sCls = q.status === 'accepted' ? 's-accepted' : q.status === 'done' ? 's-done' : 's-pending';
    const sTxt = (q.status||'pending').charAt(0).toUpperCase() + (q.status||'pending').slice(1);
    return `<div class="quote-card">
      <div class="q-head">
        <div>
          <div class="q-num">${q.quote_number}</div>
          <div class="q-name">${q.customer_name||'Unknown'}</div>
        </div>
        <div class="q-status ${sCls}">${sTxt}</div>
      </div>
      <div class="q-meta">📅 ${date} &nbsp;|&nbsp; 📱 ${q.mobile||'—'}</div>
      <div class="q-addr">📍 ${q.address||'No address'}</div>
      <div class="q-total">$${(q.total||0).toFixed(2)}</div>
      <div class="q-actions">
        <button class="btn-sms-small" onclick="sendSMS('${q.id}')">💬 SMS Quote</button>
        <select class="btn-status" onchange="updateStatus('${q.id}',this.value)">
          <option value="pending"  ${q.status==='pending'?'selected':''}>Pending</option>
          <option value="accepted" ${q.status==='accepted'?'selected':''}>Accepted</option>
          <option value="done"     ${q.status==='done'?'selected':''}>Done</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

async function sendSMS(id) {
  const q = allQuotes.find(x=>x.id===id);
  if (!q) return;
  const mobile = q.mobile?.replace(/\s/g,'');
  if (!mobile) { showToast('No mobile number on this quote'); return; }

  const itemLines = [
    ...(q.items||[]).map(i=>`• ${i.name} × ${i.qty}: $${(i.qty*i.unit_price).toFixed(2)}`),
    ...(q.custom_items||[]).map(i=>`• ${i.description}: $${(i.amount||0).toFixed(2)}`),
    q.collection_fee ? `• Collection Fee: $${q.collection_fee.toFixed(2)}` : '',
  ].filter(Boolean).join('\n');

  const body = encodeURIComponent(
    `Hi ${q.customer_name||'there'}, here is your Ridgeline Rubbish Removal quote:\n\n` +
    (q.address ? `Pickup: ${q.address}\n\n` : '') +
    `${itemLines}\n\nTOTAL: $${(q.total||0).toFixed(2)}\n\nTo confirm, reply YES or call us.`
  );

  const num = mobile.startsWith('0') ? '+61' + mobile.slice(1) : mobile;
  window.location.href = `sms:${num}?body=${body}`;
}

async function updateStatus(id, status) {
  await fetch(`/api/quotes/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ status }),
  });
  const idx = allQuotes.findIndex(x=>x.id===id);
  if (idx>-1) allQuotes[idx].status = status;
  showToast('Status updated');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

load();
</script>
</body>
</html>
