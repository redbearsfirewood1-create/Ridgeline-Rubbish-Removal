<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<title>Ridgeline — Route Planner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0;
       display: flex; flex-direction: column; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; z-index: 100; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }

/* Controls bar */
.controls { background: #111; border-bottom: 1px solid #222; padding: 10px 16px;
            display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.controls input[type=date], .controls select {
  background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 8px 12px; color: #f0f0f0; font-size: 14px; outline: none; }
.controls input[type=date]:focus, .controls select:focus { border-color: #3d8b3d; }
.btn-load { background: #3d8b3d; border: none; color: #fff; border-radius: 8px;
            padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-load:hover { background: #2d6b2d; }

/* Map */
#routeMap { flex: 1; min-height: 260px; width: 100%; }

/* Stop list */
.stop-list { overflow-y: auto; max-height: 40dvh; padding: 12px 16px 80px; }
.stop-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
             padding: 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
.stop-card.done { opacity: .55; }
.stop-num { width: 30px; height: 30px; border-radius: 50%; background: #3d8b3d; color: #fff;
            font-size: 13px; font-weight: 900; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; }
.stop-card.done .stop-num { background: #555; }
.stop-info { flex: 1; }
.stop-name  { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.stop-addr  { font-size: 12px; color: #888; margin-bottom: 6px; }
.stop-total { font-size: 13px; color: #3d8b3d; font-weight: 700; }
.stop-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-nav-stop { flex: 1; padding: 8px; background: #1f2e1f; border: 1px solid #3d8b3d;
                color: #5dbf5d; border-radius: 8px; font-size: 12px; font-weight: 700;
                text-decoration: none; text-align: center; }
.btn-done { padding: 8px 14px; background: #3d8b3d; color: #fff; border: none;
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-done:disabled { background: #555; cursor: default; }

.empty-state { text-align: center; padding: 40px 20px; color: #666; }
.summary-bar { background: #111; border-top: 1px solid #222; padding: 10px 16px;
               display: flex; gap: 20px; font-size: 13px; color: #888; flex-shrink: 0; }
.summary-bar strong { color: #3d8b3d; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
         background: #3d8b3d; color: #fff; padding: 10px 20px; border-radius: 8px;
         font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">Route Planner</div>
  <a href="/home" class="btn-back">← Home</a>
</div>

<div class="controls">
  <input type="date" id="routeDate">
  <select id="truckSelect">
    <option value="">All Trucks</option>
  </select>
  <button class="btn-load" onclick="loadRoute()">Load Route</button>
</div>

<div id="routeMap"></div>

<div class="summary-bar" id="summaryBar" style="display:none">
  <span>Stops: <strong id="sStopped">0</strong></span>
  <span>Done: <strong id="sDone">0</strong></span>
  <span>Revenue: <strong id="sRev">$0</strong></span>
  <span>Distance: <strong id="sDist">—</strong></span>
</div>

<div class="stop-list" id="stopList">
  <div class="empty-state">Select a date and truck, then tap Load Route.</div>
</div>

<div class="toast" id="toast"></div>

<script>
let map, directionsService, directionsRenderer;
let jobs = [], trucks = [];
const BASE = '{{ base_address }}';

async function init() {
  // Set today's date
  document.getElementById('routeDate').value = new Date().toISOString().split('T')[0];

  // Load trucks into selector
  const res = await fetch('/api/trucks');
  trucks = await res.json();
  const sel = document.getElementById('truckSelect');
  trucks.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id; opt.textContent = t.name;
    sel.appendChild(opt);
  });
}

function initMap() {
  map = new google.maps.Map(document.getElementById('routeMap'), {
    center: { lat: -33.83, lng: 150.99 }, zoom: 10,
    disableDefaultUI: true,
    styles: [
      { elementType:'geometry', stylers:[{color:'#1a1a1a'}] },
      { elementType:'labels.text.fill', stylers:[{color:'#888'}] },
      { elementType:'labels.text.stroke', stylers:[{color:'#111'}] },
      { featureType:'road', elementType:'geometry', stylers:[{color:'#2a2a2a'}] },
      { featureType:'road.arterial', elementType:'geometry', stylers:[{color:'#333'}] },
      { featureType:'water', elementType:'geometry', stylers:[{color:'#0d0d0d'}] },
      { featureType:'poi', stylers:[{visibility:'off'}] },
    ]
  });
  directionsService  = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    map,
    suppressMarkers: false,
    polylineOptions: { strokeColor:'#3d8b3d', strokeWeight:4 }
  });
  init();
}

async function loadRoute() {
  const date    = document.getElementById('routeDate').value;
  const truckId = document.getElementById('truckSelect').value;
  if (!date) { showToast('Pick a date first'); return; }

  let url = '/api/schedule?date=' + date;
  if (truckId) url += '&truck=' + truckId;

  const res = await fetch(url);
  jobs = await res.json();

  renderStops();
  if (jobs.length > 0) plotRoute();
}

function renderStops() {
  document.getElementById('summaryBar').style.display = jobs.length ? 'flex' : 'none';
  if (!jobs.length) {
    document.getElementById('stopList').innerHTML =
      '<div class="empty-state">No jobs scheduled for this selection.</div>';
    return;
  }

  const done = jobs.filter(j=>j.status==='done'||j.status==='completed').length;
  document.getElementById('sStopped').textContent = jobs.length;
  document.getElementById('sDone').textContent    = done;
  document.getElementById('sRev').textContent     = '$' + jobs.reduce((s,j)=>s+(j.total||0),0).toFixed(0);

  document.getElementById('stopList').innerHTML = jobs.map((j, i) => {
    const isDone = j.status === 'done' || j.status === 'completed';
    const addr   = j.address || '';
    const mapsUrl = addr
      ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}`
      : '#';
    const truck = trucks.find(t=>t.id===j.truck_id);
    return `<div class="stop-card ${isDone?'done':''}" id="sc-${j.id}">
      <div class="stop-num" style="${truck?'background:'+truck.color:''}">${i+1}</div>
      <div class="stop-info">
        <div class="stop-name">${j.customer_name||'Unknown'}</div>
        <div class="stop-addr">📍 ${addr||'No address'}</div>
        <div class="stop-total">${j.quote_number} · $${(j.total||0).toFixed(0)}</div>
        ${truck ? `<div style="font-size:11px;color:#888;margin-top:2px">🚛 ${truck.name}</div>` : ''}
        <div class="stop-actions">
          <a href="${mapsUrl}" target="_blank" class="btn-nav-stop">🗺️ Nav</a>
          <a href="/job/${j.id}" class="btn-nav-stop" style="background:#2a1f0a;border-color:#8b6d3d;color:#ffcc88">📋 Job</a>
          <button class="btn-done" id="bd-${j.id}" onclick="markDone('${j.id}')"
                  ${isDone?'disabled':''}>
            ${isDone ? '✓ Done' : '✅ Done'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function markDone(id) {
  const btn = document.getElementById('bd-' + id);
  btn.disabled = true; btn.textContent = 'Saving…';
  await fetch(`/api/quotes/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ status: 'done' })
  });
  const idx = jobs.findIndex(j=>j.id===id);
  if (idx>-1) jobs[idx].status = 'done';
  showToast('✅ Job marked complete');
  renderStops();
}

function plotRoute() {
  const addrs = jobs.map(j => j.address).filter(Boolean);
  if (addrs.length === 0) return;

  const origin      = BASE;
  const destination = addrs[addrs.length - 1];
  const waypoints   = addrs.slice(0, -1).map(a => ({ location: a, stopover: true }));

  directionsService.route({
    origin, destination, waypoints,
    optimizeWaypoints: false,
    travelMode: google.maps.TravelMode.DRIVING,
  }, (result, status) => {
    if (status === 'OK') {
      directionsRenderer.setDirections(result);
      // Total distance
      const legs  = result.routes[0].legs;
      const total = legs.reduce((s,l)=>s+l.distance.value, 0);
      document.getElementById('sDist').textContent = (total/1000).toFixed(1) + ' km';
    } else {
      showToast('Route calculation failed');
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&callback=initMap">
</script>
</body>
</html>
