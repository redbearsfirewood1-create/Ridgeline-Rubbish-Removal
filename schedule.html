<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<title>Ridgeline — Schedule</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:200; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }
.btn-trucks { background: #1f2e1f; border: 1px solid #3d8b3d; color: #5dbf5d;
              border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }

/* Month nav */
.month-nav { display: flex; align-items: center; justify-content: center; gap: 16px;
             padding: 14px 16px 10px; }
.btn-nav { background: #1a1a1a; border: 1px solid #2a2a2a; color: #f0f0f0;
           border-radius: 8px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
.btn-nav:hover { border-color: #3d8b3d; }
.month-label { font-size: 17px; font-weight: 900; min-width: 160px; text-align: center; }

/* Calendar grid */
.cal-wrap { max-width: 700px; margin: 0 auto; padding: 0 12px 80px; }
.day-headers { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 4px; }
.day-hdr { text-align: center; font-size: 11px; color: #666; font-weight: 700; padding: 4px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }

.cal-day { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
           min-height: 72px; padding: 8px 6px; cursor: pointer; position: relative;
           transition: border-color .15s; }
.cal-day:hover { border-color: #3d8b3d; }
.cal-day.today { border-color: #3d8b3d; }
.cal-day.other-month { opacity: .3; pointer-events: none; }
.cal-day.has-jobs { background: #1f2415; }
.day-num { font-size: 13px; font-weight: 700; color: #f0f0f0; margin-bottom: 4px; }
.cal-day.today .day-num { color: #5dbf5d; }
.job-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.job-dot { width: 8px; height: 8px; border-radius: 50%; }
.job-count { font-size: 10px; color: #888; margin-top: 3px; }

/* Day overlay */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 300;
           display: none; align-items: flex-end; }
.overlay.open { display: flex; }
.day-panel { background: #111; border-top: 1px solid #2a2a2a; border-radius: 20px 20px 0 0;
             width: 100%; max-height: 85dvh; overflow-y: auto; padding: 20px 16px 40px; }
.panel-drag { width: 40px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 16px; }
.panel-date { font-size: 17px; font-weight: 900; margin-bottom: 4px; }
.panel-sub  { font-size: 13px; color: #666; margin-bottom: 16px; }

/* Job cards in panel */
.sched-job { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
             padding: 14px; margin-bottom: 10px; }
.sj-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.sj-num  { font-size: 11px; font-weight: 700; color: #3d8b3d; }
.sj-name { font-size: 15px; font-weight: 700; flex: 1; }
.sj-total { font-size: 14px; font-weight: 900; color: #3d8b3d; }
.sj-addr { font-size: 12px; color: #888; margin-bottom: 10px; }
.sj-controls { display: flex; gap: 8px; align-items: center; }
.truck-select { flex: 1; background: #111; border: 1px solid #333; border-radius: 8px;
                padding: 8px 10px; color: #f0f0f0; font-size: 13px; outline: none; }
.truck-select:focus { border-color: #3d8b3d; }
.btn-unschedule { background: none; border: 1px solid #444; color: #888; border-radius: 8px;
                  padding: 8px 12px; font-size: 12px; cursor: pointer; }
.btn-unschedule:hover { border-color: #ff6b6b; color: #ff6b6b; }

/* Unscheduled jobs section */
.section-label { font-size: 12px; font-weight: 700; color: #3d8b3d; text-transform: uppercase;
                 letter-spacing: .5px; margin: 18px 0 10px; }
.unsched-job { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
               padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.uj-info { flex: 1; }
.uj-name  { font-size: 14px; font-weight: 600; }
.uj-meta  { font-size: 11px; color: #666; margin-top: 2px; }
.btn-schedule { background: #3d8b3d; border: none; color: #fff; border-radius: 8px;
                padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-schedule:hover { background: #2d6b2d; }
.btn-panel-close { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #2a2a2a;
                   color: #888; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 12px; }

/* Trucks modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 400; display: none;
            align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: #111; border: 1px solid #2a2a2a; border-radius: 16px;
         padding: 24px; width: 100%; max-width: 400px; }
.modal-title { font-size: 16px; font-weight: 900; margin-bottom: 16px; }
.truck-row { display: flex; align-items: center; gap: 10px; padding: 10px 0;
             border-bottom: 1px solid #1a1a1a; }
.truck-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.truck-name-inp { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
                  padding: 7px 10px; color: #f0f0f0; font-size: 14px; outline: none; }
.truck-color-inp { width: 36px; height: 30px; border: none; border-radius: 6px;
                   background: none; cursor: pointer; padding: 0; }
.btn-del-truck { background: none; border: none; color: #444; font-size: 16px; cursor: pointer; padding: 4px; }
.btn-del-truck:hover { color: #ff6b6b; }
.btn-add-truck { width: 100%; margin-top: 12px; padding: 10px; background: #1f2e1f;
                 border: 1px solid #3d8b3d; color: #5dbf5d; border-radius: 8px;
                 font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-modal-close { width: 100%; margin-top: 10px; padding: 10px; background: #1a1a1a;
                   border: 1px solid #2a2a2a; color: #888; border-radius: 8px; font-size: 13px; cursor: pointer; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
         background: #3d8b3d; color: #fff; padding: 10px 20px; border-radius: 8px;
         font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">Schedule</div>
  <button class="btn-trucks" onclick="openTrucksModal()">🚛 Trucks</button>
  <a href="/home" class="btn-back" style="margin-left:8px">← Home</a>
</div>

<div class="month-nav">
  <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="monthLabel"></div>
  <button class="btn-nav" onclick="changeMonth(1)">›</button>
</div>

<div class="cal-wrap">
  <div class="day-headers">
    <div class="day-hdr">Sun</div><div class="day-hdr">Mon</div><div class="day-hdr">Tue</div>
    <div class="day-hdr">Wed</div><div class="day-hdr">Thu</div><div class="day-hdr">Fri</div>
    <div class="day-hdr">Sat</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- Day overlay -->
<div class="overlay" id="dayOverlay" onclick="closeDayPanel(event)">
  <div class="day-panel" id="dayPanel">
    <div class="panel-drag"></div>
    <div class="panel-date" id="panelDate"></div>
    <div class="panel-sub" id="panelSub"></div>
    <div id="panelJobs"></div>
    <div class="section-label">Add from Unscheduled Quotes</div>
    <div id="panelUnscheduled"></div>
    <button class="btn-panel-close" onclick="closeDayPanel()">Close</button>
  </div>
</div>

<!-- Trucks modal -->
<div class="modal-bg" id="trucksModal" onclick="closeTrucksModal(event)">
  <div class="modal">
    <div class="modal-title">🚛 Manage Trucks</div>
    <div id="trucksList"></div>
    <button class="btn-add-truck" onclick="addTruck()">+ Add Truck</button>
    <button class="btn-modal-close" onclick="closeTrucksModal()">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentYear, currentMonth, jobCounts = {}, trucks = [], selectedDate = '';

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth() + 1;
  await loadTrucks();
  await renderCalendar();
}

// ── Trucks ────────────────────────────────────────────────────────────────────
async function loadTrucks() {
  const res = await fetch('/api/trucks');
  trucks = await res.json();
}

function openTrucksModal() {
  renderTrucksList();
  document.getElementById('trucksModal').classList.add('open');
}
function closeTrucksModal(e) {
  if (!e || e.target === document.getElementById('trucksModal'))
    document.getElementById('trucksModal').classList.remove('open');
}

function renderTrucksList() {
  document.getElementById('trucksList').innerHTML = trucks.map(t => `
    <div class="truck-row" id="tr-${t.id}">
      <div class="truck-color-dot" style="background:${t.color}"></div>
      <input class="truck-name-inp" type="text" value="${t.name}"
             onchange="updateTruck('${t.id}','name',this.value)">
      <input class="truck-color-inp" type="color" value="${t.color}"
             onchange="updateTruck('${t.id}','color',this.value)">
      <button class="btn-del-truck" onclick="deleteTruck('${t.id}')">✕</button>
    </div>
  `).join('');
}

async function addTruck() {
  const res = await fetch('/api/trucks', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: 'New Truck', color: '#888888' })
  });
  const t = await res.json();
  trucks.push(t);
  renderTrucksList();
}

async function updateTruck(id, field, value) {
  const t = trucks.find(x=>x.id===id);
  if (!t) return;
  t[field] = value;
  await fetch(`/api/trucks/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ [field]: value })
  });
  // Update colour dot
  const dot = document.querySelector(`#tr-${id} .truck-color-dot`);
  if (dot && field === 'color') dot.style.background = value;
}

async function deleteTruck(id) {
  if (!confirm('Remove this truck?')) return;
  await fetch(`/api/trucks/${id}`, { method:'DELETE' });
  trucks = trucks.filter(t=>t.id!==id);
  renderTrucksList();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
async function renderCalendar() {
  const monthStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
  document.getElementById('monthLabel').textContent =
    new Date(currentYear, currentMonth-1, 1).toLocaleString('en-AU', {month:'long', year:'numeric'});

  const res = await fetch('/api/schedule/month?month=' + monthStr);
  jobCounts = await res.json();

  const firstDay = new Date(currentYear, currentMonth-1, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date().toISOString().split('T')[0];

  let html = '';
  // Leading empty cells
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="cal-day other-month"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = jobCounts[dateStr] || 0;
    const isToday = dateStr === today;
    const hasJobs = count > 0;

    // Build colour dots from trucks (we don't know per-truck counts here, show generic dots)
    const dots = count > 0
      ? Array.from({length: Math.min(count, 6)}).map(() =>
          `<div class="job-dot" style="background:#3d8b3d"></div>`).join('')
      : '';

    html += `<div class="cal-day ${isToday?'today':''} ${hasJobs?'has-jobs':''}"
                  onclick="openDayPanel('${dateStr}')">
      <div class="day-num">${d}</div>
      <div class="job-dots">${dots}</div>
      ${count ? `<div class="job-count">${count} job${count!==1?'s':''}</div>` : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  renderCalendar();
}

// ── Day panel ─────────────────────────────────────────────────────────────────
async function openDayPanel(dateStr) {
  selectedDate = dateStr;
  const d = new Date(dateStr + 'T00:00');
  document.getElementById('panelDate').textContent =
    d.toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

  document.getElementById('dayOverlay').classList.add('open');
  await refreshDayPanel();
}

async function refreshDayPanel() {
  // Scheduled jobs for this day
  const [schedRes, allRes] = await Promise.all([
    fetch('/api/schedule?date=' + selectedDate),
    fetch('/api/quotes'),
  ]);
  const scheduled   = await schedRes.json();
  const allQuotes   = await allRes.json();
  const unscheduled = allQuotes.filter(q =>
    !q.scheduled_date && (q.status === 'accepted' || q.status === 'pending')
  );

  document.getElementById('panelSub').textContent =
    `${scheduled.length} job${scheduled.length!==1?'s':''} scheduled`;

  // Truck options HTML
  const truckOpts = trucks.map(t =>
    `<option value="${t.id}" style="background:#111">${t.name}</option>`
  ).join('');

  // Scheduled jobs
  document.getElementById('panelJobs').innerHTML = scheduled.length
    ? scheduled.map(q => {
        const truck = trucks.find(t=>t.id===q.truck_id);
        return `<div class="sched-job">
          <div class="sj-head">
            <div>
              <div class="sj-num">${q.quote_number}</div>
              <div class="sj-name">${q.customer_name||'Unknown'}</div>
            </div>
            <div class="sj-total">$${(q.total||0).toFixed(0)}</div>
          </div>
          <div class="sj-addr">📍 ${q.address||'No address'}</div>
          <div class="sj-controls">
            <select class="truck-select" onchange="assignTruck('${q.id}',this.value)">
              <option value="">— No truck —</option>
              ${trucks.map(t=>`<option value="${t.id}" ${q.truck_id===t.id?'selected':''}
                style="background:#111">${t.name}</option>`).join('')}
            </select>
            <button class="btn-unschedule" onclick="unscheduleJob('${q.id}')">Remove</button>
          </div>
        </div>`;
      }).join('')
    : '<p style="color:#666;font-size:13px;padding:10px 0">No jobs scheduled for this day.</p>';

  // Unscheduled
  document.getElementById('panelUnscheduled').innerHTML = unscheduled.length
    ? unscheduled.map(q => `
        <div class="unsched-job">
          <div class="uj-info">
            <div class="uj-name">${q.customer_name||'Unknown'} <span style="color:#666;font-size:11px">${q.quote_number}</span></div>
            <div class="uj-meta">📍 ${q.address||'—'} · $${(q.total||0).toFixed(0)}</div>
          </div>
          <button class="btn-schedule" onclick="scheduleJob('${q.id}')">Add →</button>
        </div>`).join('')
    : '<p style="color:#666;font-size:13px">All accepted quotes are already scheduled.</p>';
}

function closeDayPanel(e) {
  if (!e || e.target === document.getElementById('dayOverlay')) {
    document.getElementById('dayOverlay').classList.remove('open');
    renderCalendar(); // refresh counts
  }
}

async function scheduleJob(id) {
  await fetch(`/api/quotes/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scheduled_date: selectedDate, status: 'accepted' })
  });
  showToast('Job added to ' + selectedDate);
  await refreshDayPanel();
}

async function unscheduleJob(id) {
  await fetch(`/api/quotes/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scheduled_date: null, truck_id: null })
  });
  showToast('Job removed from schedule');
  await refreshDayPanel();
}

async function assignTruck(id, truckId) {
  await fetch(`/api/quotes/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ truck_id: truckId || null })
  });
  const truck = trucks.find(t=>t.id===truckId);
  showToast(truck ? `Assigned to ${truck.name}` : 'Truck removed');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
