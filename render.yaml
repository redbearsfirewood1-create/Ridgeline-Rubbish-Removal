services:
  - type: web
    name: ridgeline-rubbish-removal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USER
        value: admin
      - key: APP_PASS
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
