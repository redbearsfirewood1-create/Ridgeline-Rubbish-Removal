services:
  - type: web
    name: ridgeline-services
    env: python
    autoDeployTrigger: checksPass   # only deploy after the GitHub test suite passes
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USER
        value: admin
      - key: APP_PASS
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BUSINESS_PHONE
        sync: false
