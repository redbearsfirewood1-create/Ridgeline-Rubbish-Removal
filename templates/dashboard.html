<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<title>Ridgeline — Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:100; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }

.page { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
.section-title { font-size: 12px; font-weight: 700; color: #3d8b3d; text-transform: uppercase;
                 letter-spacing: .5px; margin-bottom: 12px; margin-top: 24px; }
.section-title:first-child { margin-top: 0; }

/* KPI grid */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0; }
.kpi { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px 14px; }
.kpi-val { font-size: 28px; font-weight: 900; color: #3d8b3d; line-height: 1; }
.kpi-lbl { font-size: 12px; color: #666; margin-top: 4px; }

/* Month summary */
.month-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 20px; }
.month-row  { display: flex; justify-content: space-between; padding: 8px 0;
              border-bottom: 1px solid #222; font-size: 14px; }
.month-row:last-child { border-bottom: none; font-weight: 700; font-size: 16px; }
.month-row .green { color: #5dbf5d; }
.month-row .red   { color: #ff6b6b; }

/* Recent quotes table */
.quote-row { display: flex; align-items: center; gap: 10px; padding: 10px 0;
             border-bottom: 1px solid #222; }
.quote-row:last-child { border-bottom: none; }
.qr-name  { flex: 1; font-size: 14px; }
.qr-date  { font-size: 12px; color: #666; }
.qr-total { font-size: 14px; font-weight: 700; color: #3d8b3d; }
.qr-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px; }
.s-pending  { background: #2e2000; color: #ffab40; }
.s-accepted { background: #1f2e1f; color: #5dbf5d; }
.s-done     { background: #1a1a2e; color: #7c9fff; }
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px; }

/* ── Ridgeline loaders ───────────────────────────────────── */
@keyframes rl-spin    { to { transform:rotate(360deg) } }
@keyframes rl-spin-r  { to { transform:rotate(-360deg) } }
@keyframes rl-glow    { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.9;transform:scale(1.45)} }
@keyframes rl-breath  { 0%,100%{opacity:.82;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
@keyframes rl-bounce  { 0%,80%,100%{transform:scale(.7);opacity:.3} 40%{transform:scale(1.25);opacity:1} }
@keyframes rl-fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes rl-scan    { 0%{left:-40%} 100%{left:110%} }

/* Full-page loader */
#rl-page-loader{
  position:fixed;inset:0;background:#0d0d0d;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
#rl-page-loader.rl-show{opacity:1;pointer-events:all;}

/* Logo + ring wrapper */
.rl-logo-wrap{
  position:relative;width:280px;height:168px;
  display:flex;align-items:center;justify-content:center;
}

/* Outer spinning oval */
.rl-oval-1{
  position:absolute;inset:-18px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#3d8b3d;border-right-color:#3d8b3d;
  box-shadow:0 0 12px rgba(61,139,61,.25);
  animation:rl-spin 1.6s cubic-bezier(.5,0,.5,1) infinite;
}
/* Inner counter-spin oval */
.rl-oval-2{
  position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid transparent;
  border-bottom-color:#2a5c2a;border-left-color:#2a5c2a;
  animation:rl-spin-r .9s linear infinite;
}
/* Green glow behind logo */
.rl-glow-bg{
  position:absolute;width:230px;height:120px;
  background:radial-gradient(ellipse at center,rgba(61,139,61,.2) 0%,transparent 70%);
  animation:rl-glow 2.8s ease-in-out infinite;
  pointer-events:none;
}
/* Logo itself */
.rl-logo-img{
  position:relative;width:220px;object-fit:contain;
  animation:rl-breath 2.8s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(61,139,61,.18));
}
/* Scan line sweep across logo */
.rl-scan-wrap{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;
}
.rl-scan-line{
  position:absolute;top:0;bottom:0;width:35%;
  background:linear-gradient(90deg,transparent,rgba(61,139,61,.12),transparent);
  animation:rl-scan 2.2s linear infinite;
}

/* Bouncing dots */
.rl-dots{display:flex;gap:9px;align-items:center;}
.rl-dot{
  width:7px;height:7px;border-radius:50%;background:#3d8b3d;
  animation:rl-bounce 1.3s ease-in-out infinite;
}
.rl-dot:nth-child(1){animation-delay:0s}
.rl-dot:nth-child(2){animation-delay:.18s;background:#2d6b2d;}
.rl-dot:nth-child(3){animation-delay:.36s;background:#1f4c1f;}

/* Inline page spinners (small) */
.rl-ring-sm{
  width:22px;height:22px;border:2px solid #1e1e1e;border-top-color:#3d8b3d;
  border-radius:50%;animation:rl-spin .75s linear infinite;flex-shrink:0;
}
.rl-loading{
  display:flex;align-items:center;justify-content:center;gap:12px;
  color:#555;font-size:13px;padding:36px 16px;
}
/* ───────────────────────────────────────────────────────── */

</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">Dashboard</div>
  <a href="/home" class="btn-back">← Home</a>
</div>

<div class="page">
  <div class="section-title">This Month</div>
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi"><div class="kpi-val" id="kpiRev">—</div><div class="kpi-lbl">Revenue</div></div>
    <div class="kpi"><div class="kpi-val" id="kpiQuotes">—</div><div class="kpi-lbl">Quotes</div></div>
    <div class="kpi"><div class="kpi-val" id="kpiExp">—</div><div class="kpi-lbl">Expenses</div></div>
    <div class="kpi"><div class="kpi-val" id="kpiProfit">—</div><div class="kpi-lbl">Net Profit</div></div>
  </div>

  <div class="section-title">Month Summary</div>
  <div class="month-card" id="monthSummary">
    <div class="month-row"><span>Revenue</span><span class="green" id="mRev">—</span></div>
    <div class="month-row"><span>Expenses</span><span class="red" id="mExp">—</span></div>
    <div class="month-row"><span>Net Profit</span><span id="mProfit">—</span></div>
  </div>

  <div class="section-title">Pipeline</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-val" id="kpiPending">—</div><div class="kpi-lbl">Pending Quotes</div></div>
    <div class="kpi"><div class="kpi-val" id="kpiAccepted">—</div><div class="kpi-lbl">Accepted</div></div>
  </div>

  <div class="section-title">Recent Quotes</div>
  <div class="card" id="recentList"><div class="rl-loading"><div class="rl-ring-sm"></div>Loading…</div></div>
</div>

<script>
async function load() {
  const [stats, quotes] = await Promise.all([
    fetch('/api/stats').then(r=>r.json()),
    fetch('/api/quotes').then(r=>r.json()),
  ]);

  const rev    = stats.month_revenue   || 0;
  const exp    = stats.month_expenses  || 0;
  const profit = rev - exp;

  const fmt = v => '$' + Math.abs(v).toLocaleString('en-AU', {maximumFractionDigits:0});

  document.getElementById('kpiRev').textContent    = fmt(rev);
  document.getElementById('kpiQuotes').textContent = stats.month_quotes ?? 0;
  document.getElementById('kpiExp').textContent    = fmt(exp);
  document.getElementById('kpiProfit').textContent = (profit < 0 ? '−' : '') + fmt(profit);

  document.getElementById('mRev').textContent    = fmt(rev);
  document.getElementById('mExp').textContent    = '−' + fmt(exp);
  const mProfit = document.getElementById('mProfit');
  mProfit.textContent = (profit < 0 ? '−' : '+') + fmt(profit);
  mProfit.style.color = profit >= 0 ? '#5dbf5d' : '#ff6b6b';

  document.getElementById('kpiPending').textContent  = stats.pending_quotes  ?? 0;
  document.getElementById('kpiAccepted').textContent = stats.accepted_quotes ?? 0;

  // Recent
  const recent = quotes.slice(0, 8);
  document.getElementById('recentList').innerHTML = recent.length
    ? recent.map(q => {
        const sCls = q.status === 'accepted' ? 's-accepted' : q.status === 'done' ? 's-done' : 's-pending';
        const sTxt = (q.status||'pending').charAt(0).toUpperCase() + (q.status||'pending').slice(1);
        const date = q.created_at ? new Date(q.created_at).toLocaleDateString('en-AU',{day:'2-digit',month:'short'}) : '';
        return `<div class="quote-row">
          <div class="qr-name">${q.customer_name||'—'}<br><span style="font-size:11px;color:#666">${q.quote_number}</span></div>
          <div class="qr-date">${date}</div>
          <div class="qr-total">$${(q.total||0).toFixed(0)}</div>
          <div class="qr-badge ${sCls}">${sTxt}</div>
        </div>`;
      }).join('')
    : '<p style="color:#666;font-size:13px;text-align:center;padding:20px">No quotes yet</p>';
}

load();
</script>
</body>
</html>
