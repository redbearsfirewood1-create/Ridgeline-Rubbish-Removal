<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<title>Ridgeline Services</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px;
             padding: 40px 32px; width: 100%; max-width: 380px; text-align: center; }
.logo { height: 64px; object-fit: contain; margin-bottom: 20px; }
.logo-text { font-size: 22px; font-weight: 900; color: #3d8b3d; margin-bottom: 4px; }
.logo-sub  { font-size: 13px; color: #666; margin-bottom: 32px; }
.field { margin-bottom: 14px; text-align: left; }
.field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
.field input { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px;
               padding: 12px 14px; color: #f0f0f0; font-size: 15px; outline: none; }
.field input:focus { border-color: #3d8b3d; }
.btn-login { width: 100%; padding: 14px; background: #3d8b3d; color: #fff; border: none;
             border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-login:hover { background: #2d6b2d; }
.error { background: #2a1a1a; border: 1px solid #8b3d3d; color: #ff6b6b;
         border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
.staff-link { margin-top: 20px; padding-top: 16px; border-top: 1px solid #222; text-align: center; }
.staff-link a { font-size: 13px; color: #3d8b3d; text-decoration: none; }
.staff-link a:hover { text-decoration: underline; }

/* ── Ridgeline loaders ───────────────────────────────────── */
@keyframes rl-spin    { to { transform:rotate(360deg) } }
@keyframes rl-spin-r  { to { transform:rotate(-360deg) } }
@keyframes rl-glow    { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.9;transform:scale(1.45)} }
@keyframes rl-breath  { 0%,100%{opacity:.82;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
@keyframes rl-bounce  { 0%,80%,100%{transform:scale(.7);opacity:.3} 40%{transform:scale(1.25);opacity:1} }
@keyframes rl-fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes rl-scan    { 0%{left:-40%} 100%{left:110%} }

/* Full-page loader */
#rl-page-loader{
  position:fixed;inset:0;background:#0d0d0d;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
#rl-page-loader.rl-show{opacity:1;pointer-events:all;}

/* Logo + ring wrapper */
.rl-logo-wrap{
  position:relative;width:280px;height:168px;
  display:flex;align-items:center;justify-content:center;
}

/* Outer spinning oval */
.rl-oval-1{
  position:absolute;inset:-18px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#3d8b3d;border-right-color:#3d8b3d;
  box-shadow:0 0 12px rgba(61,139,61,.25);
  animation:rl-spin 1.6s cubic-bezier(.5,0,.5,1) infinite;
}
/* Inner counter-spin oval */
.rl-oval-2{
  position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid transparent;
  border-bottom-color:#2a5c2a;border-left-color:#2a5c2a;
  animation:rl-spin-r .9s linear infinite;
}
/* Green glow behind logo */
.rl-glow-bg{
  position:absolute;width:230px;height:120px;
  background:radial-gradient(ellipse at center,rgba(61,139,61,.2) 0%,transparent 70%);
  animation:rl-glow 2.8s ease-in-out infinite;
  pointer-events:none;
}
/* Logo itself */
.rl-logo-img{
  position:relative;width:220px;object-fit:contain;
  animation:rl-breath 2.8s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(61,139,61,.18));
}
/* Scan line sweep across logo */
.rl-scan-wrap{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;
}
.rl-scan-line{
  position:absolute;top:0;bottom:0;width:35%;
  background:linear-gradient(90deg,transparent,rgba(61,139,61,.12),transparent);
  animation:rl-scan 2.2s linear infinite;
}

/* Bouncing dots */
.rl-dots{display:flex;gap:9px;align-items:center;}
.rl-dot{
  width:7px;height:7px;border-radius:50%;background:#3d8b3d;
  animation:rl-bounce 1.3s ease-in-out infinite;
}
.rl-dot:nth-child(1){animation-delay:0s}
.rl-dot:nth-child(2){animation-delay:.18s;background:#2d6b2d;}
.rl-dot:nth-child(3){animation-delay:.36s;background:#1f4c1f;}

/* Inline page spinners (small) */
.rl-ring-sm{
  width:22px;height:22px;border:2px solid #1e1e1e;border-top-color:#3d8b3d;
  border-radius:50%;animation:rl-spin .75s linear infinite;flex-shrink:0;
}
.rl-loading{
  display:flex;align-items:center;justify-content:center;gap:12px;
  color:#555;font-size:13px;padding:36px 16px;
}
/* ───────────────────────────────────────────────────────── */

</style>
</head>
<body>
<div class="login-box">
  <img src="/static/logo.png" class="logo" alt="Ridgeline" onerror="this.style.display='none'">
  <div class="logo-text">Ridgeline</div>
  <div class="logo-sub">Services</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">Sign In</button>
  </form>
  <div class="staff-link">
    <a href="/checklist">👷 Staff member? Sign in to your checklist here</a>
  </div>
</div>
</body>
</html>
