<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<title>Ridgeline — New Quote</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:100; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }

.page { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }

/* Section cards */
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 700; color: #3d8b3d; text-transform: uppercase;
              letter-spacing: .5px; margin-bottom: 16px; }

/* Form fields */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
.field input, .field textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px;
  padding: 11px 13px; color: #f0f0f0; font-size: 15px; outline: none; font-family: Arial, sans-serif; }
.field input:focus, .field textarea:focus { border-color: #3d8b3d; }
.field textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Photo upload */
.photo-upload { border: 2px dashed #333; border-radius: 12px; padding: 24px; text-align: center;
                cursor: pointer; transition: border-color .2s; }
.photo-upload:hover { border-color: #3d8b3d; }
.photo-upload input { display: none; }
.photo-icon { font-size: 32px; margin-bottom: 8px; }
.photo-hint { font-size: 12px; color: #666; }
#photoPreview { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px;
                margin-top: 12px; display: none; }

/* Detected items */
.detect-row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
              border-bottom: 1px solid #222; }
.detect-row:last-child { border-bottom: none; }
.detect-name { flex: 1; font-size: 14px; color: #ccc; }
.detect-price { font-size: 13px; color: #888; min-width: 70px; text-align: right; }
.qty-ctrl { display: flex; align-items: center; gap: 0; }
.qty-btn { width: 30px; height: 30px; background: #222; border: 1px solid #333; color: #f0f0f0;
           font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-btn:first-child { border-radius: 8px 0 0 8px; }
.qty-btn:last-child  { border-radius: 0 8px 8px 0; }
.qty-btn:hover { background: #2a2a2a; }
.qty-val { width: 36px; height: 30px; background: #111; border-top: 1px solid #333;
           border-bottom: 1px solid #333; border-left: none; border-right: none;
           color: #f0f0f0; font-size: 14px; font-weight: 700; text-align: center;
           outline: none; }

/* Custom items */
.custom-item-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.custom-item-row input { flex: 1; background: #111; border: 1px solid #333; border-radius: 8px;
                         padding: 9px 12px; color: #f0f0f0; font-size: 14px; outline: none; }
.custom-item-row input:focus { border-color: #3d8b3d; }
.custom-item-row .inp-price { max-width: 90px; }
.btn-remove { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; padding: 4px; }
.btn-remove:hover { color: #ff6b6b; }
.btn-add-item { background: none; border: 1px dashed #444; color: #888; border-radius: 8px;
                padding: 8px 14px; font-size: 13px; cursor: pointer; width: 100%; margin-top: 4px; }
.btn-add-item:hover { border-color: #3d8b3d; color: #3d8b3d; }

/* Distance / fee */
.dist-row { display: flex; align-items: center; gap: 10px; }
.dist-row input { flex: 1; }
.btn-lookup { background: #3d8b3d; border: none; color: #fff; border-radius: 8px;
              padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-lookup:hover { background: #2d6b2d; }
.fee-badge { display: inline-block; background: #1f2e1f; border: 1px solid #3d8b3d; color: #5dbf5d;
             border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700;
             margin-top: 8px; }

/* Cost breakdown */
.breakdown-row { display: flex; justify-content: space-between; padding: 6px 0;
                 font-size: 14px; color: #ccc; border-bottom: 1px solid #222; }
.breakdown-row:last-child { border-bottom: none; }
.breakdown-row.total { font-size: 18px; font-weight: 900; color: #f0f0f0; padding-top: 10px; }
.breakdown-row.total span:last-child { color: #3d8b3d; }

/* SMS button */
.btn-sms { width: 100%; padding: 16px; background: #3d8b3d; color: #fff; border: none;
           border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
           text-decoration: none; display: block; text-align: center; margin-bottom: 10px; }
.btn-sms:hover { background: #2d6b2d; }
.btn-save { width: 100%; padding: 14px; background: #1f2e1f; border: 1px solid #3d8b3d;
            color: #5dbf5d; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; text-align: center; }
.btn-save:hover { background: #2a3d2a; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
         background: #3d8b3d; color: #fff; padding: 10px 20px; border-radius: 8px;
         font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s;
         pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="Ridgeline" onerror="this.style.display='none'">
  <div class="topbar-title">New Quote</div>
  <a href="/home" class="btn-back">← Home</a>
</div>

<div class="page">

  <!-- Customer Info -->
  <div class="card">
    <div class="card-title">📝 Customer Details</div>
    <div class="field">
      <label>Customer Name</label>
      <input type="text" id="custName" placeholder="John Smith">
    </div>
    <div class="row2">
      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="custMobile" placeholder="04xx xxx xxx">
      </div>
      <div class="field">
        <label>Quote Notes</label>
        <input type="text" id="custNotes" placeholder="Optional notes">
      </div>
    </div>
  </div>

  <!-- Photo + Detection -->
  <div class="card">
    <div class="card-title">📸 Site Photo</div>
    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
      <input type="file" id="photoInput" accept="image/*" onchange="onPhotoSelected(this)">
      <div class="photo-icon" id="photoIcon">📷</div>
      <div class="photo-hint" id="photoHint">Tap to add a site photo</div>
    </div>
    <img id="photoPreview" alt="Site photo">
  </div>

  <!-- Detected Items -->
  <div class="card">
    <div class="card-title">🗑️ Items for Removal</div>
    <div id="itemsList">
      <div class="detect-row" data-item="Mattress" data-price="200">
        <div class="detect-name">🛏️ Mattress</div>
        <div class="detect-price">$200 ea</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('Mattress',-1)">−</button>
          <input class="qty-val" type="number" id="qty-Mattress" value="0" min="0" onchange="calcTotal()">
          <button class="qty-btn" onclick="changeQty('Mattress',1)">+</button>
        </div>
      </div>
      <div class="detect-row" data-item="Tyre" data-price="100">
        <div class="detect-name">🔵 Tyre</div>
        <div class="detect-price">$100 ea</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('Tyre',-1)">−</button>
          <input class="qty-val" type="number" id="qty-Tyre" value="0" min="0" onchange="calcTotal()">
          <button class="qty-btn" onclick="changeQty('Tyre',1)">+</button>
        </div>
      </div>
    </div>

    <div style="margin-top: 18px; margin-bottom: 8px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .5px;">Additional Items</div>
    <div id="customItems"></div>
    <button class="btn-add-item" onclick="addCustomItem()">+ Add item</button>
  </div>

  <!-- Collection Location -->
  <div class="card">
    <div class="card-title">📍 Collection Location</div>
    <div class="field">
      <label>Pickup Address</label>
      <input type="text" id="pickupAddr" placeholder="Start typing address…"
             autocomplete="off" oninput="onAddrInput()">
    </div>
    <div id="placeSuggestions" style="background:#111;border:1px solid #333;border-radius:8px;display:none;margin-top:-8px;margin-bottom:10px;"></div>
    <div class="dist-row">
      <div class="field" style="flex:1;margin:0">
        <label>Distance (km)</label>
        <input type="number" id="distKm" placeholder="Auto-calculated" min="0" step="0.1" onchange="onManualKm()">
      </div>
      <button class="btn-lookup" onclick="lookupDistance()">Calc Distance</button>
    </div>
    <div id="feeBadge" style="display:none" class="fee-badge">Collection Fee: $0</div>
  </div>

  <!-- Cost Breakdown -->
  <div class="card">
    <div class="card-title">💰 Quote Breakdown</div>
    <div id="breakdownRows"></div>
  </div>

  <!-- Actions -->
  <div class="card">
    <div class="card-title">📨 Send & Save</div>
    <a id="btnSMS" href="#" class="btn-sms" onclick="return sendSMS()">💬 Send Quote via SMS</a>
    <button class="btn-save" onclick="saveQuote()">💾 Save Quote</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let collectionFee = 0;
let savedPhotoName = '';
let savedQuoteId   = '';
let autocompleteService, placesService;

const ITEMS = { Mattress: 200, Tyre: 100 };

// ── Qty controls ──────────────────────────────────────────────────────────────
function changeQty(name, delta) {
  const el = document.getElementById('qty-' + name);
  el.value = Math.max(0, parseInt(el.value||0) + delta);
  calcTotal();
}

// ── Custom items ──────────────────────────────────────────────────────────────
let customIdx = 0;
function addCustomItem(desc='', price='') {
  const id = customIdx++;
  const div = document.createElement('div');
  div.className = 'custom-item-row';
  div.id = 'ci-' + id;
  div.innerHTML = `
    <input type="text"   placeholder="Description" value="${desc}" oninput="calcTotal()">
    <input type="number" placeholder="$0" class="inp-price" value="${price}" min="0" step="0.01" oninput="calcTotal()">
    <button class="btn-remove" onclick="document.getElementById('ci-${id}').remove();calcTotal()">✕</button>
  `;
  document.getElementById('customItems').appendChild(div);
  calcTotal();
}

// ── Photo handling ────────────────────────────────────────────────────────────
function onPhotoSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('photoPreview');
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('photoIcon').textContent = '✅';
    document.getElementById('photoHint').textContent = file.name;
  };
  reader.readAsDataURL(file);
}

async function uploadPhoto(quoteId) {
  const input = document.getElementById('photoInput');
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('photo', input.files[0]);
  const res = await fetch(`/api/quotes/${quoteId}/photo`, { method:'POST', body:fd });
  if (res.ok) {
    const d = await res.json();
    savedPhotoName = d.photo;
  }
}

// ── Address autocomplete ──────────────────────────────────────────────────────
let addrTimer;
function onAddrInput() {
  clearTimeout(addrTimer);
  addrTimer = setTimeout(() => {
    const q = document.getElementById('pickupAddr').value.trim();
    if (q.length < 3 || !autocompleteService) return;
    autocompleteService.getPlacePredictions(
      { input: q, componentRestrictions: { country: 'au' } },
      (predictions, status) => {
        const box = document.getElementById('placeSuggestions');
        if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) { box.style.display='none'; return; }
        box.innerHTML = predictions.map(p =>
          `<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #222;font-size:14px;color:#ccc"
               onmousedown="selectPlace('${p.place_id}','${p.description.replace(/'/g,"\\'")}')">
            ${p.description}
          </div>`
        ).join('');
        box.style.display = 'block';
      }
    );
  }, 400);
}

function selectPlace(placeId, desc) {
  document.getElementById('pickupAddr').value = desc;
  document.getElementById('placeSuggestions').style.display = 'none';
  lookupDistance(placeId);
}

function lookupDistance(placeId) {
  const addr = document.getElementById('pickupAddr').value.trim();
  if (!addr && !placeId) { showToast('Enter a pickup address first'); return; }
  const origin      = '620 Merrylands Road, Greystanes NSW 2145';
  const destination = addr;
  const svc = new google.maps.DistanceMatrixService();
  svc.getDistanceMatrix({
    origins: [origin],
    destinations: [destination],
    travelMode: google.maps.TravelMode.DRIVING,
    unitSystem: google.maps.UnitSystem.METRIC,
  }, (res, status) => {
    if (status !== 'OK') { showToast('Could not calculate distance'); return; }
    const el = res.rows[0]?.elements[0];
    if (el?.status !== 'OK') { showToast('Distance lookup failed'); return; }
    const km = el.distance.value / 1000;
    document.getElementById('distKm').value = km.toFixed(1);
    onManualKm();
  });
}

function onManualKm() {
  const km = parseFloat(document.getElementById('distKm').value) || 0;
  fetch('/api/collection-fee?km=' + km)
    .then(r=>r.json())
    .then(d => {
      collectionFee = d.fee;
      const badge = document.getElementById('feeBadge');
      badge.textContent = `Collection Fee: $${d.fee} (${km.toFixed(1)} km)`;
      badge.style.display = 'inline-block';
      calcTotal();
    });
}

// ── Total calculation ─────────────────────────────────────────────────────────
function calcTotal() {
  let rows = [];
  let subtotal = 0;

  // Standard items
  for (const [name, price] of Object.entries(ITEMS)) {
    const qty = parseInt(document.getElementById('qty-' + name)?.value || 0);
    if (qty > 0) {
      const line = qty * price;
      rows.push({ label: `${name} × ${qty}`, amount: line });
      subtotal += line;
    }
  }

  // Custom items
  document.querySelectorAll('#customItems .custom-item-row').forEach(row => {
    const desc  = row.querySelector('input[type=text]')?.value?.trim();
    const price = parseFloat(row.querySelector('input[type=number]')?.value || 0);
    if (desc || price) {
      rows.push({ label: desc || 'Custom item', amount: price });
      subtotal += price;
    }
  });

  // Collection fee
  if (collectionFee > 0) {
    rows.push({ label: 'Collection Fee', amount: collectionFee });
    subtotal += collectionFee;
  }

  const total = subtotal;

  const html = rows.map(r =>
    `<div class="breakdown-row"><span>${r.label}</span><span>$${r.amount.toFixed(2)}</span></div>`
  ).join('') +
  `<div class="breakdown-row total"><span>Total</span><span>$${total.toFixed(2)}</span></div>`;

  document.getElementById('breakdownRows').innerHTML = html || '<p style="color:#666;font-size:13px">No items added yet</p>';
  return { rows, total };
}

// ── SMS ────────────────────────────────────────────────────────────────────────
function sendSMS() {
  const name    = document.getElementById('custName').value.trim();
  const mobile  = document.getElementById('custMobile').value.trim().replace(/\s/g,'');
  if (!mobile) { showToast('Enter a mobile number first'); return false; }

  const { rows, total } = calcTotal();
  const addr    = document.getElementById('pickupAddr').value.trim();
  const itemLines = rows.map(r => `• ${r.label}: $${r.amount.toFixed(2)}`).join('\n');

  const body = encodeURIComponent(
    `Hi ${name||'there'}, here is your Ridgeline Services quote:\n\n` +
    (addr ? `Pickup: ${addr}\n\n` : '') +
    `${itemLines}\n\nTOTAL: $${total.toFixed(2)}\n\nTo confirm, reply YES or call us.`
  );

  const num = mobile.startsWith('0') ? '+61' + mobile.slice(1) : mobile;
  window.location.href = `sms:${num}?body=${body}`;
  return false;
}

// ── Save ───────────────────────────────────────────────────────────────────────
async function saveQuote() {
  const name   = document.getElementById('custName').value.trim();
  const mobile = document.getElementById('custMobile').value.trim();
  const addr   = document.getElementById('pickupAddr').value.trim();
  const notes  = document.getElementById('custNotes').value.trim();

  if (!name) { showToast('Enter a customer name'); return; }

  const { rows, total } = calcTotal();
  const items = [];
  for (const [n, p] of Object.entries(ITEMS)) {
    const qty = parseInt(document.getElementById('qty-' + n)?.value || 0);
    if (qty > 0) items.push({ name: n, qty, unit_price: p });
  }
  const customItems = [];
  document.querySelectorAll('#customItems .custom-item-row').forEach(row => {
    const d = row.querySelector('input[type=text]')?.value?.trim();
    const p = parseFloat(row.querySelector('input[type=number]')?.value || 0);
    if (d || p) customItems.push({ description: d, amount: p });
  });

  const payload = {
    customer_name: name, mobile, address: addr, notes,
    distance_km:    parseFloat(document.getElementById('distKm').value || 0),
    collection_fee: collectionFee,
    items, custom_items: customItems, total,
  };

  const res = await fetch('/api/quotes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (!res.ok) { showToast('Failed to save'); return; }
  const quote = await res.json();
  savedQuoteId = quote.id;

  // Upload photo if we have one
  if (document.getElementById('photoInput').files[0]) {
    await uploadPhoto(quote.id);
  }

  showToast(`✅ Quote ${quote.quote_number} saved`);
  setTimeout(() => window.location.href = '/quotes', 1800);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Google Maps init ──────────────────────────────────────────────────────────
function initMaps() {
  autocompleteService = new google.maps.places.AutocompleteService();
  placesService       = new google.maps.places.PlacesService(document.createElement('div'));
}

calcTotal();
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&libraries=places&callback=initMaps">
</script>
</body>
</html>
