<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b3d">
<title>Ridgeline — Expenses</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d0d0d; min-height: 100dvh; color: #f0f0f0; }

.topbar { background: #111; border-bottom: 1px solid #222; padding: 0 16px;
          height: 52px; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:100; }
.topbar img { height: 28px; object-fit: contain; }
.topbar-title { font-size: 15px; font-weight: 900; color: #3d8b3d; flex: 1; }
.btn-back { font-size: 12px; color: #888; text-decoration: none; }
.btn-add  { background: #3d8b3d; color: #fff; border: none; border-radius: 8px;
            padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }

/* Add form */
.add-form { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 16px; }
.form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.form-row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.field label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
.field input, .field select {
  width: 100%; background: #111; border: 1px solid #333; border-radius: 8px;
  padding: 10px 12px; color: #f0f0f0; font-size: 14px; outline: none; }
.field input:focus, .field select:focus { border-color: #3d8b3d; }
.field select option { background: #111; }
.btn-submit { width: 100%; padding: 12px; background: #3d8b3d; color: #fff; border: none;
              border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-submit:hover { background: #2d6b2d; }

/* Totals */
.totals-bar { background: #111; border-bottom: 1px solid #222; padding: 12px 16px;
              display: flex; gap: 16px; justify-content: space-around; max-width: 680px; margin: 0 auto; }
.total-item { text-align: center; }
.total-val  { font-size: 18px; font-weight: 900; color: #3d8b3d; }
.total-lbl  { font-size: 11px; color: #666; margin-top: 2px; }

/* Expense list */
.list { max-width: 680px; margin: 0 auto; padding: 14px 16px 60px; }
.exp-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
            padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.exp-icon { font-size: 24px; flex-shrink: 0; }
.exp-info { flex: 1; }
.exp-desc { font-size: 14px; font-weight: 600; color: #f0f0f0; }
.exp-meta { font-size: 12px; color: #666; margin-top: 2px; }
.exp-amount { font-size: 16px; font-weight: 900; color: #ff6b6b; flex-shrink: 0; }
.btn-del { background: none; border: none; color: #444; font-size: 16px; cursor: pointer;
           padding: 4px 6px; flex-shrink: 0; }
.btn-del:hover { color: #ff6b6b; }

.empty { text-align: center; padding: 60px 20px; color: #666; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
         background: #3d8b3d; color: #fff; padding: 10px 20px; border-radius: 8px;
         font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }

.cat-icons { Fuel: '⛽', Labour: '👷', Equipment: '🔧', Disposal: '🗑️', Vehicle: '🚛', Other: '📦' }
</style>
</head>
<body>

<div class="topbar">
  <img src="/static/logo.png" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">Expenses</div>
  <button class="btn-add" onclick="toggleForm()">+ Add</button>
  <a href="/home" class="btn-back" style="margin-left:8px">← Home</a>
</div>

<div class="add-form" id="addForm" style="display:none">
  <div class="form-row3">
    <div class="field">
      <label>Description</label>
      <input type="text" id="fDesc" placeholder="e.g. Diesel fill-up">
    </div>
    <div class="field">
      <label>Amount ($)</label>
      <input type="number" id="fAmount" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="fDate">
    </div>
  </div>
  <div class="field" style="margin-bottom:10px">
    <label>Category</label>
    <select id="fCat">
      <option>Fuel</option>
      <option>Labour</option>
      <option>Equipment</option>
      <option>Disposal</option>
      <option>Vehicle</option>
      <option>Other</option>
    </select>
  </div>
  <button class="btn-submit" onclick="addExpense()">Save Expense</button>
</div>

<div class="totals-bar">
  <div class="total-item"><div class="total-val" id="tMonth">$0</div><div class="total-lbl">This Month</div></div>
  <div class="total-item"><div class="total-val" id="tYear">$0</div><div class="total-lbl">This Year</div></div>
  <div class="total-item"><div class="total-val" id="tCount">0</div><div class="total-lbl">Entries</div></div>
</div>

<div class="list" id="expList">
  <div class="empty">Loading…</div>
</div>

<div class="toast" id="toast"></div>

<script>
const CAT_ICONS = { Fuel:'⛽', Labour:'👷', Equipment:'🔧', Disposal:'🗑️', Vehicle:'🚛', Other:'📦' };
let expenses = [];

function toggleForm() {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') {
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  }
}

async function load() {
  const res = await fetch('/api/expenses');
  expenses = await res.json();
  render();
}

function render() {
  const now = new Date();
  const thisMonth = now.toISOString().slice(0,7);
  const thisYear  = String(now.getFullYear());

  const mTotal = expenses.filter(e=>e.date?.startsWith(thisMonth)).reduce((s,e)=>s+(e.amount||0),0);
  const yTotal = expenses.filter(e=>e.date?.startsWith(thisYear)).reduce((s,e)=>s+(e.amount||0),0);
  document.getElementById('tMonth').textContent = '$' + mTotal.toFixed(0);
  document.getElementById('tYear').textContent  = '$' + yTotal.toFixed(0);
  document.getElementById('tCount').textContent = expenses.length;

  if (!expenses.length) {
    document.getElementById('expList').innerHTML = '<div class="empty">No expenses recorded yet.</div>';
    return;
  }

  document.getElementById('expList').innerHTML = expenses.map(e => {
    const icon = CAT_ICONS[e.category] || '📦';
    const date = e.date ? new Date(e.date+'T00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}) : '';
    return `<div class="exp-card">
      <div class="exp-icon">${icon}</div>
      <div class="exp-info">
        <div class="exp-desc">${e.description||'—'}</div>
        <div class="exp-meta">${e.category||'Other'} · ${date}</div>
      </div>
      <div class="exp-amount">$${(e.amount||0).toFixed(2)}</div>
      <button class="btn-del" onclick="deleteExpense('${e.id}')">✕</button>
    </div>`;
  }).join('');
}

async function addExpense() {
  const desc   = document.getElementById('fDesc').value.trim();
  const amount = parseFloat(document.getElementById('fAmount').value || 0);
  const date   = document.getElementById('fDate').value;
  const cat    = document.getElementById('fCat').value;

  if (!desc) { showToast('Enter a description'); return; }
  if (!amount) { showToast('Enter an amount'); return; }

  const res = await fetch('/api/expenses', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ description: desc, amount, date, category: cat }),
  });
  if (!res.ok) { showToast('Failed to save'); return; }
  const exp = await res.json();
  expenses.unshift(exp);
  render();

  // Reset form
  document.getElementById('fDesc').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('addForm').style.display = 'none';
  showToast('✅ Expense saved');
}

async function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  await fetch(`/api/expenses/${id}`, { method:'DELETE' });
  expenses = expenses.filter(e=>e.id!==id);
  render();
  showToast('Deleted');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

load();
</script>
</body>
</html>
